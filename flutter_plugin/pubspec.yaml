name: rs_ffi_barrage
version: 0.1.0
description: 高性能Flutter弹幕插件，底层Rust FFI引擎，支持Emoji贴图三种注册、文字特效、多轨道调度。使用 Dart Hooks 系统自动编译 Rust 代码，支持所有平台。
homepage: https://github.com/HDYOU/rs_ffi_barrage

environment:
  # native_toolchain_rust ^1.0.4 需要 Dart SDK 3.9+
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  
  # ── FFI 核心依赖 ───────────────────────────────────────────────────────────
  ffi: ^2.1.0
  
  # ── Hooks 构建系统依赖 ─────────────────────────────────────────────────────
  # Dart Hooks 核心：提供 build() 函数和 BuildInput/BuildOutput
  hooks: ^1.0.0
  
  # 代码资产定义：CodeAsset, LinkMode 等
  code_assets: ^1.1.0
  
  # Rust 编译工具链：自动调用 cargo 编译 cdylib
  native_toolchain_rust: ^1.0.4
  
  # ── 其他功能依赖 ───────────────────────────────────────────────────────────
  path: ^1.8.0
  path_provider: ^2.1.0
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# ── Hooks 配置 ───────────────────────────────────────────────────────────────
# Flutter 3.41+ 使用 Hooks 系统，不再需要平台特定的构建文件
# hook/build.dart 脚本会自动处理所有平台的 Rust 编译
flutter:
  plugin:
    platforms:
      android:
      ios:
      linux:
      macos:
      windows: