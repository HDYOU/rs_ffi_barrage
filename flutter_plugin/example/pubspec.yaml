name: rs_ffi_barrage_example
description: rs_ffi_barrage 插件演示工程 — Dart Hooks 自动编译 Rust 原生代码
publish_to: 'none'
version: 1.0.0

environment:
  # native_toolchain_rust ^1.0.4 需要 Dart SDK 3.9+
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  rs_ffi_barrage:
    path: ../
  http: ^1.1.0
  path_provider: ^2.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/emoji_heart.png
    - assets/emoji_star.png