[package]
name = "rs_ffi_barrage"
version = "0.1.0"
edition = "2021"
description = "高性能Rust弹幕引擎内核，FFI C ABI导出供Flutter/Dart调用"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "rs_ffi_barrage"

[dependencies]
# 核心依赖（必需）
crossbeam = "0.8"
parking_lot = "0.12"
once_cell = "1"
lru = "0.7"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 可选依赖（通过 feature 控制）
image = { version = "0.23", optional = true }
ureq = { version = "2", optional = true }
cbindgen = { version = "0.20", optional = true }

[build-dependencies]
cbindgen = "0.20"

[features]
default = ["image", "ureq", "cbindgen"]
full = ["image", "ureq", "cbindgen"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "barrage_bench"
harness = false